
name: Customer Churn ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train customer churn model
        run: python train_model.py

        
      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Upload churn model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-artifacts
          path: |
            customer_churn_model.pkl
            metrics.json
          if-no-files-found: error
          retention-days: 7


      - name: Run ML pipeline tests
        run: python -m unittest test_ml_pipeline.py -v


        
      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp customer_churn_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf "Customer Churn Prediction API\nRun: python app.py\nHealth: GET /health\nPrediction: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Build Docker image
        run: docker build -t customer-churn-api:latest .

 
      - name: Run Docker container
        run: |
          docker run -d --name churn-api -p 5000:5000 customer-churn-api:latest

      - name: Wait for API
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 3
          done
          docker logs churn-api
          exit 1

      - name: Test prediction API
        run: |
          curl -f http://localhost:5000/
          curl -f http://localhost:5000/health

      - name: Stop Docker container
        if: always()
        run: docker rm -f churn-api || true

      
      - name: Prepare GHCR image name
        run: |
          IMAGE_ID="ghcr.io/${{ github.repository_owner }}/customer-churn-api"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Tag Customer Churn image
        if: github.event_name != 'pull_request'
        run: |
          docker tag customer-churn-api:latest "$IMAGE_ID:latest"
          docker tag customer-churn-api:latest "$IMAGE_ID:sha-${{ github.sha }}"

      - name: Publish image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${{ github.sha }}"

